<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>{% block title %}Tailgate{% endblock %}</title>

		<link rel="stylesheet" href="/static/bootstrap.min.css" crossorigin="anonymous">
		<link rel="stylesheet" href="/static/bootstrap-theme.min.css" crossorigin="anonymous">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-fork-ribbon-css/0.2.3/gh-fork-ribbon.min.css" />
		<script src="/static/jquery.min.js"></script>
		<script src="/static/bootstrap.min.js" crossorigin="anonymous"></script>
	</head>
	<body>
		<div class="container">
			<a class="github-fork-ribbon" href="https://github.com/palfrey/tailgate" data-ribbon="Fork me on GitHub" title="Fork me on GitHub">Fork me on GitHub</a>			
			{% with messages = get_flashed_messages() %}
			  {% if messages %}
			    {% for message in messages %}
			      <div class="alert alert-success" role="alert">{{ message }}</div>
			    {% endfor %}
			  {% endif %}
			{% endwith %}
			{% block content %}{% endblock %}
		</div>
	</body>
</html>
